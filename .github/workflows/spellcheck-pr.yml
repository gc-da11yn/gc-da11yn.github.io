name: Spellcheck (PR)

on:
  pull_request:
    paths:
      - "src/**"

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee spellcheck.log

      - name: Build site
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a spellcheck.log

      - name: Check spelling (findings are non-blocking)
        run: |
          set -o pipefail
          npm run spellcheck:pr 2>&1 | tee -a spellcheck.log

      - name: Upload spellcheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spellcheck-log
          path: spellcheck.log
          retention-days: 7
